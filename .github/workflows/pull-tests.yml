name: Pull rtc-cpp tests

on:
  workflow_dispatch:
    inputs:
      project:
        description: "rtc-cpp project"
        type: choice
        options: [voice, video]
        default: voice
      sha:
        description: "Short SHA of the rtc-cpp build (leave empty for the newest complete build under packages/)"
        required: false
        default: ""
  repository_dispatch:
    # Fired by rtc-cpp Buildkite after all linux+darwin builds land in S3.
    # Payload shape:
    #   {
    #     "project": "voice"|"video",
    #     "sha": "<short-sha>",
    #     "bucket": "cpp-test-artifacts",
    #     "artifacts": [
    #       { "platform": "linux",  "arch": "x86_64", "build_type": "debug",   "key": "packages/...tar.gz", "version_id": "..." },
    #       { "platform": "linux",  "arch": "x86_64", "build_type": "release", ... },
    #       { "platform": "darwin", "arch": "arm64",  "build_type": "debug",   ... },
    #       { "platform": "darwin", "arch": "arm64",  "build_type": "release", ... }
    #     ]
    #   }
    # Each matrix leg filters artifacts to its own platform/arch and downloads
    # by exact {key, version_id}, so an S3 overwrite between dispatch and
    # download doesn't feed us different bytes than the dispatcher signed off on.
    types: [rtc-cpp-tests-ready]

permissions:
  id-token: write
  contents: read

# Logging policy: this repo is public, so its Actions logs are too, while
# rtc-cpp is private. Normal runs print only project/platform/build_type and
# counts. rtc-cpp SHAs, S3 keys, version ids, extracted file names, and aws/tar
# error output are printed only when RUNNER_DEBUG=1 ("Re-run jobs" → "Enable
# debug logging"), which requires repo write access to turn on.
#
# GitHub prints every `env:` value (after expanding `${{ }}`) at the top of each
# step's log, including step outputs used there. So nothing sensitive goes
# through `env:`, step outputs, or `${{ }}` in a `run:` script: the payload and
# inputs are read from $GITHUB_EVENT_PATH, and the resolved artifact list is
# handed to the download step in a file under $RUNNER_TEMP.

jobs:
  pull:
    name: pull (${{ matrix.platform }}-${{ matrix.arch }})
    # One job definition for every platform, so the resolve/validate/download
    # logic exists exactly once. Add a platform by adding a matrix entry, and to
    # REQUIRED in the resolve step.
    strategy:
      # A failure on one platform shouldn't cancel the other's run.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-x64
          - platform: darwin
            arch: arm64
            runner: macos-arm
    runs-on: ${{ matrix.runner }}
    # Bounded so a hung job can't sit holding credentials for GitHub's 6-hour
    # default. Download + untar takes a couple of minutes.
    timeout-minutes: 15
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838 # v1 — Twilio enterprise-allowlisted SHA
        with:
          # Set the AWS_ROLE_ARN Actions Variable in repo settings, so the ARN
          # isn't in the workflow file.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve target artifacts
        run: |
          set -euo pipefail
          # Writes $RUNNER_TEMP/artifacts.json: [{build_type,key,version_id}]
          # filtered to PLATFORM+ARCH.
          # repository_dispatch: taken from the payload, with version ids.
          # workflow_dispatch: keys from list-objects-v2, no version ids
          # (mutable-key fallback).
          python3 <<'PY'
          import json, os, re, subprocess, sys, traceback

          debug = os.environ.get("RUNNER_DEBUG") == "1"

          def fail(msg, detail=None):
              # `msg` goes to the public log and must not contain SHAs, keys,
              # version ids or payload values; `detail` only shows in debug.
              if debug and detail:
                  print(f"::debug::{detail}")
              print(f"::error::{msg}")
              sys.exit(1)

          # Hardcoded, not taken from the payload: anyone who can fire a
          # repository_dispatch shouldn't be able to point the runner at a
          # bucket of their choosing.
          BUCKET = "cpp-test-artifacts"
          # Every platform/arch the matrix runs. A manual "newest" run picks a
          # build that has all of them, so every leg resolves the same SHA.
          REQUIRED = [("linux", "x86_64"), ("darwin", "arm64")]
          BUILD_TYPES = ("debug", "release")
          SHA_RE = re.compile(r"[0-9a-f]{7,40}")
          VERSION_ID_RE = re.compile(r"[A-Za-z0-9._-]{1,1024}")

          def expected_key(project, platform, arch, bt, sha):
              return f"packages/{project}-{platform}-{arch}-{bt}-{sha}.tar.gz"

          def resolve_dispatch(payload, platform, arch):
              project = payload.get("project")
              if project not in ("voice", "video"):
                  fail("repository_dispatch payload has a missing or invalid 'project'",
                       f"project={project!r}")
              if payload.get("bucket") not in (None, BUCKET):
                  fail(f"repository_dispatch payload bucket is not {BUCKET}",
                       f"bucket={payload.get('bucket')!r}")
              sha = payload.get("sha")
              if not isinstance(sha, str) or not SHA_RE.fullmatch(sha):
                  fail("repository_dispatch payload 'sha' is not a hex commit SHA", f"sha={sha!r}")
              all_artifacts = payload.get("artifacts")
              if not isinstance(all_artifacts, list):
                  fail("repository_dispatch payload 'artifacts' is missing or not a list")
              # Filter to our own platform+arch (payload also carries the other platform).
              mine = [a for a in all_artifacts
                      if isinstance(a, dict) and a.get("platform") == platform and a.get("arch") == arch]
              if sorted(str(a.get("build_type")) for a in mine) != sorted(BUILD_TYPES):
                  fail(f"repository_dispatch payload must carry exactly one debug and one release "
                       f"artifact for {platform}/{arch}",
                       f"build_types={[a.get('build_type') for a in mine]!r}")
              artifacts = []
              for a in mine:
                  bt, key, vid = a["build_type"], a.get("key"), a.get("version_id")
                  # The key must be exactly what the producer's naming scheme yields for
                  # this project/platform/arch/build_type/sha — nothing outside packages/,
                  # no other project, no other commit.
                  want = expected_key(project, platform, arch, bt, sha)
                  if key != want:
                      fail(f"repository_dispatch payload key for {bt} doesn't match the naming scheme",
                           f"key={key!r} expected={want!r}")
                  if not isinstance(vid, str) or not VERSION_ID_RE.fullmatch(vid):
                      fail(f"repository_dispatch payload version_id for {bt} is missing or malformed",
                           f"version_id={vid!r}")
                  artifacts.append({"build_type": bt, "key": key, "version_id": vid})
              return project, sha, artifacts

          def newest_complete_sha(project):
              # One listing for the project, so every matrix leg sees the same
              # objects. A build counts only once all REQUIRED platforms have
              # both build types uploaded; otherwise "newest" could be a build
              # whose release (or other platform) isn't in S3 yet.
              # `Contents || ``[]``` guards the empty-prefix case: list-objects-v2
              # omits Contents entirely when nothing matches.
              try:
                  q = subprocess.run(
                      ["aws", "s3api", "list-objects-v2",
                       "--bucket", BUCKET,
                       "--prefix", f"packages/{project}-",
                       "--query", "Contents[].[Key, LastModified] || `[]`",
                       "--output", "json"],
                      check=True, capture_output=True, text=True,
                  )
              except subprocess.CalledProcessError as e:
                  fail(f"listing s3://{BUCKET}/packages/ failed (re-run with debug logging for details)",
                       e.stderr.strip())
              wanted = {(p, a, bt) for p, a in REQUIRED for bt in BUILD_TYPES}
              # Basename format: <project>-<platform>-<arch>-<build_type>-<sha>.tar.gz.
              # Known components contain no `-`, so the fields split cleanly.
              key_re = re.compile(rf"packages/{project}-([a-z0-9]+)-([a-z0-9_]+)-(debug|release)-([0-9a-f]{{7,40}})\.tar\.gz")
              seen, newest = {}, {}
              for key, modified in json.loads(q.stdout or "[]"):
                  m = key_re.fullmatch(key)
                  if not m or (m[1], m[2], m[3]) not in wanted:
                      continue
                  sha = m[4]
                  seen.setdefault(sha, set()).add((m[1], m[2], m[3]))
                  newest[sha] = max(newest.get(sha, ""), modified)
              complete = [sha for sha, have in seen.items() if have == wanted]
              if not complete:
                  fail(f"no {project} build under s3://{BUCKET}/packages/ has all of "
                       f"{sorted(p + '/' + a for p, a in REQUIRED)} in debug and release")
              # ISO-8601 timestamps sort chronologically as strings.
              return max(complete, key=lambda s: newest[s])

          def resolve_manual(inputs, platform, arch):
              project = inputs.get("project") or "voice"
              if project not in ("voice", "video"):
                  fail("invalid 'project' input", f"project={project!r}")
              sha = inputs.get("sha") or ""
              if sha and not SHA_RE.fullmatch(sha):
                  fail("'sha' input is not a hex commit SHA", f"sha={sha!r}")
              if not sha:
                  sha = newest_complete_sha(project)
              # No version ids on this path: whatever is at the key now is used.
              artifacts = [{"build_type": bt, "key": expected_key(project, platform, arch, bt, sha),
                            "version_id": ""} for bt in BUILD_TYPES]
              return project, sha, artifacts

          def main():
              platform, arch = os.environ["PLATFORM"], os.environ["ARCH"]
              event_name = os.environ["GITHUB_EVENT_NAME"]
              with open(os.environ["GITHUB_EVENT_PATH"]) as f:
                  event = json.load(f)
              if event_name == "repository_dispatch":
                  payload = event.get("client_payload")
                  if not isinstance(payload, dict):
                      fail("repository_dispatch has no client_payload object")
                  project, sha, artifacts = resolve_dispatch(payload, platform, arch)
              elif event_name == "workflow_dispatch":
                  project, sha, artifacts = resolve_manual(event.get("inputs") or {}, platform, arch)
              else:
                  fail(f"unexpected event {event_name}")

              print(f"{event_name}: {project} — {len(artifacts)} artifacts for {platform}/{arch}")
              if debug:
                  print(f"::debug::sha={sha} artifacts={json.dumps(artifacts)}")
              with open(os.path.join(os.environ["RUNNER_TEMP"], "artifacts.json"), "w") as f:
                  json.dump({"bucket": BUCKET, "artifacts": artifacts}, f)

          try:
              main()
          except SystemExit:
              raise
          except Exception:
              # A traceback can carry payload values in exception messages.
              fail("resolving artifacts failed (re-run with debug logging for details)",
                   traceback.format_exc().replace("\n", " | "))
          PY

      - name: Download and untar debug + release
        run: |
          set -euo pipefail
          mkdir -p tests
          cd tests

          # For repository_dispatch, version_id is non-empty and we download the
          # exact object version the dispatcher recorded. For workflow_dispatch,
          # it's empty and we take whatever is at the key now.
          python3 <<'PY'
          import json, os, subprocess, sys, traceback

          debug = os.environ.get("RUNNER_DEBUG") == "1"

          def fail(msg, detail=None):
              # Same rule as the resolve step: `msg` is public, `detail` is debug-only.
              if debug and detail:
                  print(f"::debug::{detail}")
              print(f"::error::{msg}")
              sys.exit(1)

          def step(bt, what, cmd):
              # check=True would raise CalledProcessError, whose message is the
              # full command line (key, version id), so run unchecked and report
              # generically instead.
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  fail(f"{bt}: {what} failed (re-run with debug logging for details)",
                       (r.stderr or "").strip().replace("\n", " | "))

          def main():
              with open(os.path.join(os.environ["RUNNER_TEMP"], "artifacts.json")) as f:
                  resolved = json.load(f)
              bucket = resolved["bucket"]
              for a in resolved["artifacts"]:
                  bt, key, vid = a["build_type"], a["key"], a["version_id"]
                  print(f"--- {bt}" + (" (pinned version)" if vid else " (latest)"))
                  if debug:
                      print(f"::debug::s3://{bucket}/{key} version={vid or '<latest>'}")
                  cmd = ["aws", "s3api", "get-object", "--bucket", bucket, "--key", key]
                  if vid:
                      cmd += ["--version-id", vid]
                  # get-object prints the response (VersionId, ETag, metadata) as
                  # JSON on stdout; it's captured, not printed.
                  step(bt, "download", cmd + [f"{bt}.tar.gz"])
                  os.makedirs(bt, exist_ok=True)
                  step(bt, "extract", ["tar", "-xzf", f"{bt}.tar.gz", "-C", bt])
                  os.remove(f"{bt}.tar.gz")
                  # Tarballs are staged with a `tests/` root by the producer so
                  # voice and video extract identically; expect `<bt>/tests/...`.
                  files = [os.path.join(d, n) for d, _, names in os.walk(bt) for n in names]
                  if not files:
                      fail(f"{bt} tarball extracted no files")
                  print(f"extracted {len(files)} files to tests/{bt}")
                  if debug:
                      for p in files:
                          print(f"::debug::{p}")

          try:
              main()
          except SystemExit:
              raise
          except Exception:
              fail("downloading artifacts failed (re-run with debug logging for details)",
                   traceback.format_exc().replace("\n", " | "))
          PY
