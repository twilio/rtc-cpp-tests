name: rtc-cpp tests

on:
  workflow_dispatch:
    inputs:
      project:
        description: "rtc-cpp project"
        type: choice
        options: [voice, video]
        default: voice
      sha:
        description: "First 12 characters of the rtc-cpp commit (empty: the newest build with every platform uploaded, at least 10 minutes old)"
        required: false
        default: ""
  repository_dispatch:
    # Fired by rtc-cpp Buildkite after all linux+darwin builds land in S3 and
    # the linux sanitizer builds finish (a failed one is left out).
    # Payload shape:
    #   {
    #     "project": "voice"|"video",
    #     "sha": "<short-sha>",
    #     "bucket": "cpp-test-artifacts",
    #     "artifacts": [
    #       { "platform": "linux",  "arch": "x86_64", "build_type": "debug",   "key": "packages/...tar.gz", "version_id": "..." },
    #       { "platform": "linux",  "arch": "x86_64", "build_type": "release", ... },
    #       { "platform": "darwin", "arch": "arm64",  "build_type": "debug",   ... },
    #       { "platform": "darwin", "arch": "arm64",  "build_type": "release", ... },
    #       { "platform": "linux",  "arch": "x86_64", "build_type": "debug", "sanitizer": "asan", ... }
    #     ]
    #   }
    # Sanitizer artifacts (ASan and TSan, for voice and video) are linux
    # x86_64 debug only and optional, so a payload from an rtc-cpp build that
    # predates them is still accepted.
    types: [rtc-cpp-tests-ready]

permissions:
  contents: read

# Logging policy: this repo is public, so its Actions logs and artifacts are
# too (any signed-in GitHub user can download a public repo's artifacts),
# while rtc-cpp is private.
#   - rtc-cpp SHAs, S3 keys, version ids and extracted file names are never
#     printed, not even with debug logging (its log is just as public). See
#     scripts/fetch_artifact.py.
#   - Test stdout/stderr and gtest XML (SDK/WebRTC logs, assertion text) are
#     discarded on the runner; only test names, statuses and counts are
#     printed and uploaded. See scripts/run_gtest_isolated.py.
#   - GitHub prints every `env:` value (after expanding `${{ }}`) at the top of
#     each step's log, including step outputs used there. So nothing sensitive
#     goes through `env:`, step outputs, or `${{ }}` in a `run:` script: the
#     payload and inputs are read from $GITHUB_EVENT_PATH.

jobs:
  plan:
    # Builds the test matrix (fixed tables in scripts/plan_matrix.py) and the
    # cutoff a manual "newest build" run resolves against, so every test job
    # (and any re-run of one) picks the same rtc-cpp build.
    runs-on: ubuntu-x64
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cutoff: ${{ steps.plan.outputs.cutoff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          # Assigned first: `set -e` ignores a failing $(...) inside echo.
          matrix="$(python3 scripts/plan_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: plan
    # One job per (suite, platform, build variant, shard), so a run takes
    # about as long as its slowest shard. The shard counts are CircleCI's
    # `parallelism` for the same job.
    strategy:
      # One failing job shouldn't cancel the rest.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    # Each test has its own 15-minute timeout; this bounds a whole shard. The
    # test steps time out 15 minutes earlier, so the results still upload.
    timeout-minutes: 240
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      VARIANT: ${{ matrix.variant }}
      BIN_DIR: tests/${{ matrix.variant }}/tests
      RESULTS: ${{ github.workspace }}/results/results-${{ matrix.name }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838 # v1 — Twilio enterprise-allowlisted SHA
        with:
          # Set the AWS_ROLE_ARN Actions Variable in repo settings, so the ARN
          # isn't in the workflow file.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          # Only needed for the download below; the minimum STS allows.
          role-duration-seconds: 900

      - name: Download the test build
        id: fetch
        env:
          CUTOFF: ${{ needs.plan.outputs.cutoff }}
        run: python3 scripts/fetch_artifact.py

      - name: Drop AWS credentials
        # The tests don't need them, so they don't run with them.
        if: always()
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            echo "$v=" >> "$GITHUB_ENV"
          done

      - name: Stage media files
        if: steps.fetch.outputs.available == 'true'
        # In rtc-cpp these sit next to the test binaries (CMake POST_BUILD
        # copies), and the tests find them via dirname($TEST_PATH) or the cwd;
        # AUDIO_FILE_PATH points at audio_dtx16.wav. The tarballs only carry
        # the executables, so this repo supplies them (copied from
        # rtc-cpp common/test/support/voice_engine/).
        env:
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          test -x "$BIN_DIR/$EXE" || { echo "::error::$EXE is not in the $VARIANT build"; exit 1; }
          cp media/*.wav "$BIN_DIR/"
          mkdir -p "$(dirname "$RESULTS")"

      - name: Install linux runtime libraries
        # Every linux test binary links libX11.so.6 (the containerized image
        # installs it too).
        if: steps.fetch.outputs.available == 'true' && matrix.platform == 'linux' && !matrix.containerized
        run: |
          dpkg -s libx11-6 > /dev/null 2>&1 && exit 0
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libx11-6

      - name: Allow sanitizer runtimes on this kernel
        # Ubuntu 24.04 runners use vm.mmap_rnd_bits=32, which ASan/TSan
        # binaries from older toolchains can't map their shadow memory under.
        if: steps.fetch.outputs.available == 'true' && matrix.sanitizer != ''
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Set up Node for the voice websocket server
        if: steps.fetch.outputs.available == 'true' && matrix.project == 'voice' && matrix.suite == 'integration' && matrix.platform == 'darwin'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Start the voice websocket server
        # CircleCI started it for voice integration on darwin only: the
        # voice-notify tests that use it are only built for darwin. Without
        # NGROK_AUTHTOKEN and the test-account .env (credentials aren't vended
        # yet, VBLOCKS-7638) it runs local-only and those tests fail. Its
        # output can carry call tokens, so it goes to a file, not the log.
        if: steps.fetch.outputs.available == 'true' && matrix.project == 'voice' && matrix.suite == 'integration' && matrix.platform == 'darwin'
        working-directory: voice/websocket-server
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --loglevel=error
          nohup node server.js > "$RUNNER_TEMP/websocket-server.log" 2>&1 &
          for _ in $(seq 1 10); do
            curl -sf http://localhost:3000/publicUrl > /dev/null && { echo "websocket server is up"; exit 0; }
            sleep 1
          done
          echo "::warning::the voice websocket server didn't come up; its tests will fail"

      - name: Run tests
        if: steps.fetch.outputs.available == 'true' && !matrix.containerized
        timeout-minutes: 225
        env:
          NAME: ${{ matrix.name }}
          EXE: ${{ matrix.exe }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          EXCLUDE: ${{ matrix.exclude }}
          SANITIZER: ${{ matrix.sanitizer }}
          TWILIO_ENVIRONMENT: Production
          # CircleCI: 5/3 for regular test jobs, 0/0 for sanitizer jobs.
          TWILIO_TEST_LOG_LEVEL: ${{ matrix.sanitizer == '' && '5' || '0' }}
          TWILIO_TEST_WEBRTC_LOG_LEVEL: ${{ matrix.sanitizer == '' && '3' || '0' }}
          TWILIO_TEST_WEBRTC_TRACE_EVENT_LOGGING: "0"
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/$BIN_DIR"
          export TEST_PATH="$bin/$EXE" AUDIO_FILE_PATH="$bin/audio_dtx16.wav"
          extra=()
          if [ -n "$SANITIZER" ]; then
            # CircleCI's sanitizer options; the suppressions file ships in the
            # TSan tarball.
            export ASAN_OPTIONS=detect_leaks=0
            export TSAN_OPTIONS="second_deadlock_stack=1 history_size=7 die_after_fork=0 suppressions=$bin/tsan_suppressions.txt"
            extra=(-- --disable-signal-handler)
          fi
          python3 scripts/run_gtest_isolated.py --binary "$TEST_PATH" --label "$NAME" \
            --shard "$SHARD" --shards "$SHARDS" --exclude "$EXCLUDE" --results "$RESULTS" ${extra[@]+"${extra[@]}"}

      - name: Load network test kernel modules
        # The container can't load modules itself. Privileged containers
        # usually get them autoloaded on first use; loading them here makes a
        # missing one show up as a warning, not as failing network tests.
        if: steps.fetch.outputs.available == 'true' && matrix.containerized
        run: |
          sudo modprobe -a sch_netem xt_statistic xt_iprange xt_multiport \
            || echo "::warning::couldn't load the tc netem / iptables match modules; network tests that use them will fail"

      - name: Run containerized tests
        # The network tests break the network (ip/tc/iptables) and move
        # between docker networks, so they run in a privileged container that
        # drives the host docker daemon through its socket, as in CircleCI.
        if: steps.fetch.outputs.available == 'true' && matrix.containerized
        timeout-minutes: 225
        env:
          NAME: ${{ matrix.name }}
          EXE: ${{ matrix.exe }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          EXCLUDE: ${{ matrix.exclude }}
          SANITIZER: ${{ matrix.sanitizer }}
          TWILIO_ENVIRONMENT: Production
          TWILIO_TEST_LOG_LEVEL: ${{ matrix.sanitizer == '' && '5' || '0' }}
          TWILIO_TEST_WEBRTC_LOG_LEVEL: ${{ matrix.sanitizer == '' && '3' || '0' }}
          TWILIO_TEST_WEBRTC_TRACE_EVENT_LOGGING: "0"
        run: |
          set -euo pipefail
          docker build --quiet -t rtc-cpp-containerized -f docker/containerized.Dockerfile docker > /dev/null
          out="$RUNNER_TEMP/container-out"
          mkdir -p "$out"
          # The runner writes its results file straight into results/, after
          # every test, so it survives a timeout or cancel.
          results_dir="$(dirname "$RESULTS")"
          opts=()
          extra=()
          if [ -n "$SANITIZER" ]; then
            opts=(-e ASAN_OPTIONS=detect_leaks=0)
            # CircleCI passed "-disable-signal-handler" (one dash) here, which
            # the test runner doesn't recognise. Fixed.
            extra=(-- --disable-signal-handler)
          fi
          # Unlike CircleCI, TEST_PATH is passed in and all three wavs sit next
          # to the binary, so the live-transcription test finds its audio.
          docker run --rm --privileged --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            --name "nw-test-$GITHUB_RUN_ID-$GITHUB_JOB" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/$BIN_DIR:/opt/twilio/tests" \
            -v "$GITHUB_WORKSPACE/scripts:/opt/twilio/scripts:ro" \
            -v "$out:/out" \
            -v "$results_dir:/out/results" \
            -e TEST_PATH="/opt/twilio/tests/$EXE" \
            -e AUDIO_FILE_PATH=/opt/twilio/tests/audio_dtx16.wav \
            -e TWILIO_ENVIRONMENT -e TWILIO_TEST_LOG_LEVEL -e TWILIO_TEST_WEBRTC_LOG_LEVEL \
            -e TWILIO_TEST_WEBRTC_TRACE_EVENT_LOGGING \
            -e GITHUB_STEP_SUMMARY=/out/step-summary.md \
            ${opts[@]+"${opts[@]}"} \
            rtc-cpp-containerized \
            python3 /opt/twilio/scripts/run_gtest_isolated.py --binary "/opt/twilio/tests/$EXE" \
              --label "$NAME" --shard "$SHARD" --shards "$SHARDS" --exclude "$EXCLUDE" \
              --restore-routes --results "/out/results/$(basename "$RESULTS")" ${extra[@]+"${extra[@]}"}

      - name: Clean up the test container
        # A cancelled `docker run` leaves its container (and the step summary
        # it wrote) behind.
        if: always() && matrix.containerized
        run: |
          docker rm -f "nw-test-$GITHUB_RUN_ID-$GITHUB_JOB" > /dev/null 2>&1 || true
          f="$RUNNER_TEMP/container-out/step-summary.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Record skipped job
        if: steps.fetch.outputs.available == 'false'
        run: |
          mkdir -p "$(dirname "$RESULTS")"
          echo '{"skipped": true}' > "$RESULTS"

      - name: Record a job that didn't run its tests
        # Every job uploads a results file, so a re-run attempt that fails
        # early replaces the earlier attempt's results instead of leaving
        # them in the summary.
        if: always()
        run: |
          mkdir -p "$(dirname "$RESULTS")"
          [ -f "$RESULTS" ] || echo '{"error": "the job failed before it ran any tests"}' > "$RESULTS"

      - name: Upload results
        # Test names and statuses only (see the logging policy above).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: results/
          if-no-files-found: error
          # Replace an earlier attempt's artifact when a job is re-run.
          overwrite: true
          retention-days: 14

  summary:
    # The combined result of every test job: which jobs and tests didn't pass.
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Summarize
        env:
          RESULTS_DIR: results
        # The matrix is rebuilt from the event (same tables, same result)
        # rather than passed through `env:`, which would print all of it.
        run: |
          set -euo pipefail
          MATRIX="$(python3 scripts/plan_matrix.py 2>/dev/null)"
          export MATRIX
          python3 scripts/summarize_results.py
